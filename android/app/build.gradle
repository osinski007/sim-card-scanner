plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.sim_card_scanner"
    compileSdk 35
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.example.sim_card_scanner"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"

        // 性能优化配置
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a' // 只打包主流架构，减小 APK 体积
        }

        // 启用多 dex 文件优化
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            shrinkResources false
            minifyEnabled false

            // 性能优化
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // 编译优化
    dexOptions {
        preDexLibraries = true
        maxProcessCount 8
    }
}

flutter {
    source = "../.."
}
